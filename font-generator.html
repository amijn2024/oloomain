    <script>
        // Unicode character converters
        function convertOffset(str, upperStart, lowerStart, digitStart) {
            return str.split('').map(char => {
                const code = char.charCodeAt(0);
                if (code >= 65 && code <= 90 && upperStart) { // A-Z
                    return String.fromCodePoint(upperStart + (code - 65));
                } else if (code >= 97 && code <= 122 && lowerStart) { // a-z
                    return String.fromCodePoint(lowerStart + (code - 97));
                } else if (code >= 48 && code <= 57 && digitStart) { // 0-9
                    return String.fromCodePoint(digitStart + (code - 48));
                }
                return char;
            }).join('');
        }

        // Font Style Definitions
        const fontStyles = [
            { name: "Bold (Sans-Serif)", transform: str => convertOffset(str, 0x1D5A0, 0x1D5BA, 0x1D7EC) },
            { name: "Bold (Serif)", transform: str => convertOffset(str, 0x1D400, 0x1D41A, 0x1D7CE) },
            { name: "Italic (Sans)", transform: str => convertOffset(str, 0x1D608, 0x1D622, null) },
            { name: "Bold Italic", transform: str => convertOffset(str, 0x1D63C, 0x1D656, 0x1D7EC) },
            { name: "Cursive / Script Bold", transform: str => convertOffset(str, 0x1D4D0, 0x1D4EA, null) },
            { name: "Gothic / Fraktur Bold", transform: str => convertOffset(str, 0x1D56C, 0x1D586, null) },
            { name: "Double Struck (Outline)", transform: str => convertOffset(str, 0x1D538, 0x1D552, 0x1D7D8) },
            { name: "Monospace", transform: str => convertOffset(str, 0x1D670, 0x1D68A, 0x1D7F6) },
            { 
                name: "Circled (Outline)", 
                transform: str => str.split('').map(c => {
                    const code = c.charCodeAt(0);
                    if (code >= 65 && code <= 90) return String.fromCodePoint(0x24B6 + (code - 65));
                    if (code >= 97 && code <= 122) return String.fromCodePoint(0x24D0 + (code - 97));
                    if (code >= 49 && code <= 57) return String.fromCodePoint(0x2460 + (code - 49));
                    return c;
                }).join('') 
            },
            { 
                name: "Vaporwave / Fullwidth", 
                transform: str => str.split('').map(c => {
                    const code = c.charCodeAt(0);
                    if (code >= 33 && code <= 126) return String.fromCodePoint(0xFF01 + (code - 33));
                    return c;
                }).join('') 
            }
        ];

        document.addEventListener("DOMContentLoaded", () => {
            const inputText = document.getElementById('inputText');
            const fontResults = document.getElementById('fontResults');

            // Render Font Items
            function generateFonts() {
                const text = inputText.value.trim() || "Type something cool";
                fontResults.innerHTML = '';

                fontStyles.forEach((style, index) => {
                    const convertedText = style.transform(text);

                    const item = document.createElement('div');
                    item.className = 'font-item';
                    item.innerHTML = `
                        <div class="font-details">
                            <div class="font-name">${style.name}</div>
                            <div class="font-text" id="font-out-${index}">${convertedText}</div>
                        </div>
                        <button class="copy-btn" onclick="copyFontText('font-out-${index}', this)">Copy Font</button>
                    `;
                    fontResults.appendChild(item);
                });
            }

            // Real-time generation as user types
            inputText.addEventListener('input', generateFonts);

            // Initial render on load
            generateFonts();
        });

        // Copy Functionality with Animation
        function copyFontText(elementId, btn) {
            const textToCopy = document.getElementById(elementId).innerText;

            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "Copied! ✔";
                btn.classList.add("copied");

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove("copied");
                }, 2000);
            }).catch(err => {
                console.error("Failed to copy:", err);
            });
        }
    </script>
